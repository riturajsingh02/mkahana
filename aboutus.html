    <!-- Scripts -->
    <script>
        // Announcement Bar Slider
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.announcement-slide-item');
            if (slides.length > 1) {
                let current = 0;
                setInterval(() => {
                    slides[current].classList.remove('active');
                    current = (current + 1) % slides.length;
                    slides[current].classList.add('active');
                }, 3800);
            }
        });

        // Sticky Header scroll elevation
        window.addEventListener('scroll', () => {
            const header = document.getElementById('siteHeader');
            if (header) {
                if (window.scrollY > 20) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            }
        });

        // Mobile Nav Drawer Toggle
        function toggleMobileNav() {
            const drawer = document.getElementById('mobile-nav-drawer');
            const content = document.getElementById('mobile-menu-content');
            if (!drawer || !content) return;
            const isOpen = drawer.classList.contains('opacity-100');
            if (!isOpen) {
                drawer.classList.remove('pointer-events-none', 'opacity-0');
                drawer.classList.add('opacity-100');
                content.classList.remove('-translate-x-full');
                document.body.style.overflow = 'hidden';
            } else {
                drawer.classList.remove('opacity-100');
                drawer.classList.add('opacity-0', 'pointer-events-none');
                content.classList.add('-translate-x-full');
                document.body.style.overflow = '';
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const drawer = document.getElementById('mobile-nav-drawer');
                const content = document.getElementById('mobile-menu-content');
                if (!drawer || !content) return;
                drawer.classList.remove('opacity-100');
                drawer.classList.add('opacity-0', 'pointer-events-none');
                content.classList.add('-translate-x-full');
                document.body.style.overflow = '';
            }
        });

        // Intersection Observer for Reveal animations
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.12 });

        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        // ==========================================
        // Ultra-Luxury Interactive Vision Experience
        // ==========================================
        (function initVisionInteractivity() {
            // 1. Bioluminescent Golden Particles Canvas
            const canvas = document.getElementById('vision-particles-canvas');
            const section = document.getElementById('our-vision-section');
            if (canvas && section) {
                const ctx = canvas.getContext('2d');
                let width = canvas.width = section.offsetWidth;
                let height = canvas.height = section.offsetHeight;

                let mouse = { x: width / 2, y: height / 2, active: false };

                const resizeCanvas = () => {
                    width = canvas.width = section.offsetWidth;
                    height = canvas.height = section.offsetHeight;
                };
                window.addEventListener('resize', resizeCanvas);

                section.addEventListener('mousemove', (e) => {
                    const rect = section.getBoundingClientRect();
                    mouse.x = e.clientX - rect.left;
                    mouse.y = e.clientY - rect.top;
                    mouse.active = true;
                });
                section.addEventListener('mouseleave', () => {
                    mouse.active = false;
                });

                // Generate golden stardust particles
                const particleCount = window.innerWidth < 768 ? 24 : 45;
                const particles = Array.from({ length: particleCount }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2 + 0.8,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: -Math.random() * 0.5 - 0.15,
                    alpha: Math.random() * 0.6 + 0.2,
                    pulse: Math.random() * 0.02 + 0.01,
                    goldHue: Math.random() > 0.5 ? '#E8CD84' : '#C9A961'
                }));

                function animateParticles() {
                    ctx.clearRect(0, 0, width, height);

                    particles.forEach(p => {
                        p.y += p.vy;
                        p.x += p.vx;
                        p.alpha += Math.sin(Date.now() * 0.002 + p.x) * p.pulse * 0.1;

                        // Wrap edges
                        if (p.y < 0) p.y = height;
                        if (p.x < 0) p.x = width;
                        if (p.x > width) p.x = 0;

                        // Gentle mouse attraction / repulsion
                        if (mouse.active) {
                            const dx = mouse.x - p.x;
                            const dy = mouse.y - p.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 140) {
                                p.x += (dx / dist) * 0.4;
                                p.y += (dy / dist) * 0.4;
                            }
                        }

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.goldHue;
                        ctx.globalAlpha = Math.max(0.1, Math.min(0.85, p.alpha));
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#E8CD84';
                        ctx.fill();
                    });

                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    requestAnimationFrame(animateParticles);
                }
                requestAnimationFrame(animateParticles);
            }
        })();

        // ==========================================
        // From Pond to Partner - Interactive Zero-Scroll Showcase (User-Controlled, No Automatic Scrolling)
        // ==========================================
        (function initPondToPartnerShowcase() {
            const section = document.getElementById('journey-showcase-section');
            if (!section) return;

            const categoryLabels = [
                'AQUATIC ORIGIN',
                'GENERATIONAL CRAFT',
                'ARTISANAL POPPING',
                'PRECISION GRADING',
                'EXPORT BARRIER',
                'GLOBAL LOGISTICS'
            ];

            let currentStage = 0;
            const totalStages = 6;

            const tabBtns = section.querySelectorAll('.stage-tab-btn');
            const mediaSlides = section.querySelectorAll('.stage-slide-media');
            const contentPanes = section.querySelectorAll('.stage-content-pane');
            const thumbCards = section.querySelectorAll('.stage-thumb-card');
            const dots = section.querySelectorAll('#stage-dots span');
            const indexEl = document.getElementById('current-stage-index');
            const categoryEl = document.getElementById('stage-floating-category');
            const progressBar = document.getElementById('stage-progress-bar');
            const prevBtns = [document.getElementById('stage-prev-btn'), document.getElementById('stage-prev-bottom')];
            const nextBtns = [document.getElementById('stage-next-btn'), document.getElementById('stage-next-bottom')];

            function goToStage(idx) {
                currentStage = (idx + totalStages) % totalStages;

                // 1. Update Tabs (without automatic scrollIntoView)
                tabBtns.forEach((btn, i) => {
                    if (i === currentStage) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 2. Update Media Slides (Crossfade)
                mediaSlides.forEach((slide, i) => {
                    if (i === currentStage) {
                        slide.classList.add('active');
                    } else {
                        slide.classList.remove('active');
                    }
                });

                // 3. Update Content Panes
                contentPanes.forEach((pane, i) => {
                    if (i === currentStage) {
                        pane.classList.add('active');
                    } else {
                        pane.classList.remove('active');
                    }
                });

                // 4. Update Thumbnails
                thumbCards.forEach((thumb, i) => {
                    if (i === currentStage) {
                        thumb.classList.add('active');
                    } else {
                        thumb.classList.remove('active');
                    }
                });

                // 5. Update Dots
                dots.forEach((dot, i) => {
                    if (i === currentStage) {
                        dot.className = 'w-4 h-2 rounded-full bg-[#E8CD84] transition-all duration-300';
                    } else {
                        dot.className = 'w-2 h-2 rounded-full bg-[#C9A961]/30 transition-all duration-300';
                    }
                });

                // 6. Update Texts
                if (indexEl) indexEl.textContent = String(currentStage + 1).padStart(2, '0');
                if (categoryEl) categoryEl.textContent = categoryLabels[currentStage] || 'SUPPLY CHAIN';

                // 7. Update Step Progress Bar smoothly based on active stage
                if (progressBar) {
                    const pct = (currentStage / (totalStages - 1)) * 100;
                    progressBar.style.width = pct + '%';
                }
            }

            // Bind Tab Click
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const st = parseInt(btn.getAttribute('data-stage'), 10);
                    goToStage(st);
                });
            });

            // Bind Thumbnail Click
            thumbCards.forEach(thumb => {
                thumb.addEventListener('click', () => {
                    const st = parseInt(thumb.getAttribute('data-thumb'), 10);
                    goToStage(st);
                });
            });

            // Next & Prev buttons
            nextBtns.forEach(btn => {
                if (btn) {
                    btn.addEventListener('click', () => {
                        goToStage(currentStage + 1);
                    });
                }
            });

            prevBtns.forEach(btn => {
                if (btn) {
                    btn.addEventListener('click', () => {
                        goToStage(currentStage - 1);
                    });
                }
            });

            // Touch Swipe Support for mobile
            let touchStartX = 0;
            let touchEndX = 0;
            section.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            section.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 45) {
                    if (diff > 0) {
                        goToStage(currentStage + 1);
                    } else {
                        goToStage(currentStage - 1);
                    }
                }
            }, { passive: true });

            // Keyboard navigation when section is in view
            window.addEventListener('keydown', (e) => {
                const rect = section.getBoundingClientRect();
                const inView = rect.top < window.innerHeight && rect.bottom > 0;
                if (!inView) return;

                if (e.key === 'ArrowRight') {
                    goToStage(currentStage + 1);
                } else if (e.key === 'ArrowLeft') {
                    goToStage(currentStage - 1);
                }
            });

            // Initialize directly without automatic scrolling or timers
            goToStage(0);
        })();
    </script>
